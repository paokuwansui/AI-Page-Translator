<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 阅读助手</title>
  <style>
    :root { --primary:#2563eb; --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --border:#334155; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 400 13.5px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--card); }
    .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--primary), #1d4ed8); }
    .title { font-weight: 600; }
    .muted { color: var(--muted); font-size: 11.5px; }
    .spacer { flex: 1; }
    .modes { display: flex; gap: 6px; padding: 8px 12px 0; flex-wrap: wrap; }
    .chip { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .chip[aria-selected="true"] { border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .ctx { padding: 6px 12px; color: var(--muted); font-size: 11.5px; }
    .msgs { flex: 1; overflow-y: auto; padding: 6px 12px; }
    .msg { margin: 8px 0; padding: 9px 11px; border-radius: 10px; word-break: break-word; }
    .msg.user { background: #eff6ff; border: 1px solid #dbeafe; }
    .msg.assistant { background: var(--card); border: 1px solid var(--border); }
    .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg h1,.msg h2,.msg h3 { font-size: 14px; margin: 8px 0 4px; }
    .msg ul,.msg ol { margin: 4px 0 4px 18px; padding: 0; }
    .msg code { background: rgba(100,116,139,.18); border-radius: 4px; padding: 0 3px; font-family: ui-monospace, monospace; }
    .msg pre { background: #0f172a; color: #e2e8f0; padding: 8px; border-radius: 8px; overflow-x: auto; }
    .msg table { border-collapse: collapse; margin: 6px 0; font-size: 12.5px; }
    .msg th, .msg td { border: 1px solid var(--border); padding: 3px 6px; text-align: left; }
    .cite { border: none; background: #e0e7ff; color: #3730a3; border-radius: 5px; cursor: pointer; font-size: 11px; padding: 0 4px; }
    .chips { display: flex; gap: 6px; padding: 0 12px 6px; flex-wrap: wrap; }
    .att { display: inline-flex; gap: 5px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 11.5px; }
    .att img { width: 20px; height: 20px; object-fit: cover; border-radius: 4px; }
    .composer { border-top: 1px solid var(--border); padding: 8px 12px 10px; background: var(--card); }
    textarea { width: 100%; height: 64px; resize: none; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; font: inherit; color: inherit; background: var(--bg); }
    textarea:focus { outline: none; border-color: var(--primary); }
    .acts { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
    .btn.primary { background: linear-gradient(135deg, var(--primary), #1d4ed8); color: #fff; border: none; }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true"></span>
    <span class="title">AI 阅读助手</span>
    <span class="spacer"></span>
    <span id="model" class="muted"></span>
    <button id="mdToggle" class="btn" type="button" aria-label="切换 Markdown 渲染" aria-pressed="true" title="当前:渲染 Markdown(点击切换为纯文本)">M↓</button>
    <button id="reload" class="btn" type="button" aria-label="重新读取当前页面">重读页面</button>
    <button id="newChat" class="btn" type="button" aria-label="新建对话">新建</button>
    <button id="settings" class="btn" type="button" aria-label="打开设置" title="设置(模型 / 翻译 / 助手)">⚙</button>
  </header>
  <div id="modes" class="modes" role="tablist" aria-label="任务模式"></div>
  <div id="ctx" class="ctx" aria-live="polite">正在读取页面…</div>
  <div id="msgs" class="msgs" role="log" aria-live="polite" aria-label="对话内容"></div>
  <div id="chips" class="chips"></div>
  <div class="composer">
    <textarea id="input" aria-label="输入问题" placeholder="问点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
    <div class="acts">
      <button id="shot" class="btn" type="button" aria-label="截图翻译">📷 截图</button>
      <button id="sel" class="btn" type="button" aria-label="加入选中文本">✂ 选中</button>
      <span class="spacer"></span>
      <button id="stop" class="btn" type="button" hidden>停止</button>
      <button id="send" class="btn primary" type="button">发送</button>
    </div>
    <div class="hint">侧栏模式:页面上下文由当前标签页读取;引用 chip 可跳转到页面位置。</div>
  </div>

  <script src="../lib/common.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="../content/rag.js"></script>
  <script src="core.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
