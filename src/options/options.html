<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>LinguaFlow - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="hero">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
    </span>
    <div>
      <h1>LinguaFlow</h1>
      <p class="sub">配置 OpenAI 兼容 API,一键整页翻译</p>
    </div>
  </header>

  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      连接设置
    </h2>
    <div class="row">
      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" type="text" placeholder="https://api.openai.com/v1" spellcheck="false">
    </div>
    <div class="row">
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="留空表示无需鉴权（如 Ollama）" autocomplete="off">
    </div>
    <div class="row">
      <label for="model">模型名称</label>
      <div class="modelbox">
        <input id="model" type="text" placeholder="gpt-4o-mini" spellcheck="false">
        <button id="fetchModelsBtn" class="btn" type="button">获取模型列表</button>
      </div>
    </div>
    <select id="modelList" hidden></select>
  </section>

  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      翻译设置
    </h2>
    <div class="grid2">
      <div class="row"><label for="sourceLang">源语言</label><select id="sourceLang">
        <option value="auto">自动检测</option><option value="en">英语</option><option value="zh">中文</option>
        <option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option>
        <option value="de">德语</option><option value="es">西班牙语</option><option value="ru">俄语</option>
      </select></div>
      <div class="row"><label for="targetLang">目标语言</label><select id="targetLang">
        <option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option>
        <option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option>
        <option value="de">德语</option><option value="es">西班牙语</option><option value="ru">俄语</option>
      </select></div>
    </div>
    <div class="grid2">
      <div class="row"><label for="chunkSize">每请求字符</label><input id="chunkSize" type="number" min="200" step="100"></div>
      <div class="row"><label for="concurrency">并发请求数</label><input id="concurrency" type="number" min="1" max="8"></div>
    </div>
  </section>

  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
      行为
    </h2>
    <label class="switch-row" for="translateOnLoad">
      <input id="translateOnLoad" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
      <span class="switch-text">页面加载后自动翻译</span>
    </label>
    <label class="switch-row" for="translateDynamic">
      <input id="translateDynamic" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
      <span class="switch-text">翻译动态加载的内容</span>
    </label>
    <label class="switch-row" for="polishEnabled">
      <input id="polishEnabled" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
      <span class="switch-text">翻译后统一润色(措辞更自然,多一轮请求)</span>
    </label>
  </section>

  <div class="actions">
    <button id="testBtn" class="btn" type="button">测试连接</button>
    <button id="saveBtn" class="btn primary" type="button">保存设置</button>
  </div>
  <div id="status" class="status"></div>

  <script src="../lib/common.js"></script>
  <script src="options.js"></script>
</body>
</html>
